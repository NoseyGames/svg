const cvs=document.getElementById('starfield');const ctx=cvs.getContext('2d');let w,h,stars=[],rips=[];let mx=-1000,my=-1000;function res(){w=window.innerWidth;h=window.innerHeight;cvs.width=w;cvs.height=h}function init(){stars=[];for(let i=0;i<200;i+=1){stars.push({x:Math.random()*w,y:Math.random()*h,ox:0,oy:0,z:Math.random()*1.5+0.5,o:Math.random()*0.7+0.2,v:Math.random()*0.1+0.05});stars[i].ox=stars[i].x;stars[i].oy=stars[i].y}}function draw(){ctx.clearRect(0,0,w,h);stars.forEach(s=>{let dx=mx-s.ox;let dy=my-s.oy;let dist=Math.sqrt(dx*dx+dy*dy);let forceX=0,forceY=0;if(dist<150){let angle=Math.atan2(dy,dx);let push=(150-dist)*0.2;forceX= -Math.cos(angle)*push;forceY= -Math.sin(angle)*push}s.x+=(s.ox+forceX-s.x)*0.1;s.y+=(s.oy+forceY-s.y)*0.1;s.oy-=s.v;s.y-=s.v;if(s.oy<-10){s.oy=h+10;s.y=h+10;s.ox=Math.random()*w;s.x=s.ox}ctx.beginPath();ctx.arc(s.x,s.y,s.z,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${s.o })`;ctx.fill()});rips.forEach((r,i)=>{r.r+=6;r.a-=0.02;if(r.a<=0){rips.splice(i,1)}ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.strokeStyle=`rgba(255,62,62,${r.a })`;ctx.stroke()});requestAnimationFrame(draw)}window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});window.addEventListener('mousedown',e=>{rips.push({x:e.clientX,y:e.clientY,r:0,a:1})});window.addEventListener('resize',()=>{res();init()});document.getElementById('panicBtn').onclick=()=>document.getElementById('panicOverlay').classList.toggle('active');res();init();draw();(function(){const trigger=document.getElementById('adBypassTrigger');const ghostUrl=atob("aHR0cHM6Ly9uYXA1ay5jb20vdGFnLm1pbi5qcw==");function injectAds(){try{const target=document.body||document.documentElement;const s1=document.createElement('script');s1.dataset.zone='10813080';s1.src=ghostUrl;s1.async=true;target.appendChild(s1);const s2=document.createElement('script');s2.dataset.zone='10875111';s2.src='https://n6wxm.com/vignette.min.js';s2.async=true;target.appendChild(s2)}catch(e){console.warn('Ad injection <script>
(function() {
    /**
     * 1. AUTO-DETECT USERNAME AND REPO
     * Pulls the path from the current jsDelivr URL in the address bar.
     */
    const jsDelivrPattern = /gh\/([^/]+\/[^/]+)/;
    const match = window.location.href.match(jsDelivrPattern);

    let fullPath = "NoseyGames/data@main"; // Fallback if detection fails

    if (match) {
        fullPath = match[1];
        // If the URL doesn't have a branch (e.g., @main or @v1), add @main
        if (!fullPath.includes('@')) {
            fullPath += '@main';
        }
    }

    /**
     * 2. FILE MAPPING LOGIC
     * Determines which SVG file to use based on the link's content.
     */
    const getTargetFile = (link) => {
        const text = link.innerText.toLowerCase();
        const classes = link.className.toLowerCase();
        const href = link.getAttribute('href') || "";

        // PROTECT EXTERNAL LINKS: Don't redirect Discord, TikTok, or Ads
        if (href.includes('discord.gg') || href.includes('tiktok.com') || href.includes('omg10.com')) {
            return null;
        }

        // GAMES -> a129x.svg
        if (classes.includes('games') || text.includes('games') || href.includes('a129x')) {
            return "a129x.svg";
        }
        // MOVIES -> movies.svg
        if (classes.includes('movies') || text.includes('movies') || href.includes('movies')) {
            return "movies.svg";
        }
        // AI -> ai.svg
        if (classes.includes('ai') || text.includes('ai') || href.includes('ai')) {
            return "ai.svg";
        }
        // ALGEBRA -> algebra.svg
        if (classes.includes('algebra') || text.includes('algebra') || href.includes('algebra')) {
            return "algebra.svg";
        }
        // HOME -> page.svg
        if (classes.includes('home') || text.includes('home')) {
            return "page.svg";
        }

        return null; // Don't touch if no match
    };

    /**
     * 3. THE "FORCE" CLICK LISTENER
     * Intercepts clicks before any other script (like homepage.js) can handle them.
     */
    document.addEventListener('click', function(e) {
        const link = e.target.closest('a');
        if (!link) return;

        const targetFile = getTargetFile(link);
        if (targetFile) {
            e.preventDefault(); // Stop the default link behavior
            e.stopImmediatePropagation(); // Kill any other JS click listeners
            
            const finalDestination = `/gh/${fullPath}/svgs/${targetFile}`;
            window.location.assign(finalDestination); // Force redirect
        }
    }, true); // The 'true' ensures we catch the click first (Capture Phase)

    /**
     * 4. ATTRIBUTE OVERWRITER
     * Visually changes the href in the HTML so hover-previews look correct.
     */
    const overwriteAllLinks = () => {
        document.querySelectorAll('a').forEach(link => {
            const targetFile = getTargetFile(link);
            if (targetFile) {
                const dynamicHref = `/gh/${fullPath}/${targetFile}`;
                if (link.getAttribute('href') !== dynamicHref) {
                    link.setAttribute('href', dynamicHref);
                }
            }
        });
    };

    // Run once immediately
    overwriteAllLinks();
    
    // Pulse every 500ms to catch links generated by other scripts (Lumin, etc.)
    setInterval(overwriteAllLinks, 500);

    console.log("NikeHub Link Injector Active: Pathing to " + fullPath);
})();
