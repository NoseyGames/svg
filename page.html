<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NikeHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/NoseyGames/static@main/homepage.css">
</head>
<body>
    <canvas id="starfield"></canvas>

    <div class="support-wrapper">
        <i class="fas fa-heart" style="color: var(--accent)"></i>
        <span>enable ads (please)</span>
        <label class="switch">
            <input type="checkbox" id="adBypassTrigger">
            <span class="slider"></span>
        </label>
    </div>

    <div class="top-bar">
        <div class="logo-small">nikehub</div>
        <div class="top-icons">
            <a href="#" target="_blank" class="link-games"><i class="fas fa-gamepad"></i></a>
            <a href="#" target="_blank" class="link-ai"><i class="fas fa-robot"></i></a>
            <a href="#" target="_blank" class="link-movies"><i class="fas fa-film"></i></a>
            <a href="#" target="_blank" class="link-algebra"><i class="fas fa-link"></i></a>
        </div>
    </div>

    <div class="main-content">
        <h1 class="logo-big">nikehub</h1>
        <p class="tagline">welcome to the best unbl*ocked games site...</p>
        
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-box" placeholder="search here..." id="searchInput">
        </div>

        <div class="nav-grid">
            <a href="#" target="_blank" class="nav-item link-games">
                <i class="fas fa-gamepad"></i>
                <span class="nav-label">games</span>
            </a>
            <a href="#" target="_blank" class="nav-item link-movies">
                <i class="fas fa-film"></i>
                <span class="nav-label">movies</span>
            </a>
            <a href="https://discord.gg/Y4uMau4dGy" target="_blank" class="nav-item">
                <i class="fa-brands fa-discord"></i>
                <span class="nav-label">discord</span>
            </a>
            <a href="https://omg10.com/4/10623217" target="_blank" class="nav-item">
                <i class="fa-solid fa-play"></i>
                <span class="nav-label">ads</span>
            </a>
        </div>
    </div>

    <nav class="secondary-nav">
        <a href="#" target="_blank" class="nav-pill active link-home">Home</a>
        <a href="#" target="_blank" class="nav-pill link-games">Games</a>
        <a href="https://discord.gg/Y4uMau4dGy" target="_blank" class="nav-pill">Discord</a>
        <a href="https://www.tiktok.com/@nikehub.org" target="_blank" class="nav-pill">Tiktok</a>
    </nav>

    <button class="panic-btn" id="panicBtn">panic!</button>

    <div class="panic-overlay" id="panicOverlay">
        <h1>Algebra Notes III - Section 4.2</h1>
        <p>Synthetic division is a shorthand method of polynomial division...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/NoseyGames/static@main/homepage.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/docklib/partners@master/partner-ab151bd3.js"></script>

<script>
(function() {
    /**
     * 1. AUTO-DETECT USERNAME AND REPO
     * Pulls the path from the current jsDelivr URL in the address bar.
     */
    const jsDelivrPattern = /gh\/([^/]+\/[^/]+)/;
    const match = window.location.href.match(jsDelivrPattern);

    let fullPath = "NoseyGames/data@main"; // Fallback if detection fails

    if (match) {
        fullPath = match[1];
        // If the URL doesn't have a branch (e.g., @main or @v1), add @main
        if (!fullPath.includes('@')) {
            fullPath += '@main';
        }
    }

    /**
     * 2. FILE MAPPING LOGIC
     * Determines which SVG file to use based on the link's content.
     */
    const getTargetFile = (link) => {
        const text = link.innerText.toLowerCase();
        const classes = link.className.toLowerCase();
        const href = link.getAttribute('href') || "";

        // PROTECT EXTERNAL LINKS: Don't redirect Discord, TikTok, or Ads
        if (href.includes('discord.gg') || href.includes('tiktok.com') || href.includes('omg10.com')) {
            return null;
        }

        // GAMES -> a129x.svg
        if (classes.includes('games') || text.includes('games') || href.includes('a129x')) {
            return "a129x.svg";
        }
        // MOVIES -> movies.svg
        if (classes.includes('movies') || text.includes('movies') || href.includes('movies')) {
            return "movies.svg";
        }
        // AI -> ai.svg
        if (classes.includes('ai') || text.includes('ai') || href.includes('ai')) {
            return "ai.svg";
        }
        // ALGEBRA -> algebra.svg
        if (classes.includes('algebra') || text.includes('algebra') || href.includes('algebra')) {
            return "algebra.svg";
        }
        // HOME -> page.svg
        if (classes.includes('home') || text.includes('home')) {
            return "page.svg";
        }

        return null; // Don't touch if no match
    };

    /**
     * 3. THE "FORCE" CLICK LISTENER
     * Intercepts clicks before any other script (like homepage.js) can handle them.
     */
    document.addEventListener('click', function(e) {
        const link = e.target.closest('a');
        if (!link) return;

        const targetFile = getTargetFile(link);
        if (targetFile) {
            e.preventDefault(); // Stop the default link behavior
            e.stopImmediatePropagation(); // Kill any other JS click listeners
            
            const finalDestination = `/gh/${fullPath}/svgs/${targetFile}`;
            window.location.assign(finalDestination); // Force redirect
        }
    }, true); // The 'true' ensures we catch the click first (Capture Phase)

    /**
     * 4. ATTRIBUTE OVERWRITER
     * Visually changes the href in the HTML so hover-previews look correct.
     */
    const overwriteAllLinks = () => {
        document.querySelectorAll('a').forEach(link => {
            const targetFile = getTargetFile(link);
            if (targetFile) {
                const dynamicHref = `/gh/${fullPath}/${targetFile}`;
                if (link.getAttribute('href') !== dynamicHref) {
                    link.setAttribute('href', dynamicHref);
                }
            }
        });
    };

    // Run once immediately
    overwriteAllLinks();
    
    // Pulse every 500ms to catch links generated by other scripts (Lumin, etc.)
    setInterval(overwriteAllLinks, 500);

    console.log("NikeHub Link Injector Active: Pathing to " + fullPath);
})();
</script>
</body>
</html>
